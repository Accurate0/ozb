name: Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        apps: [discord-bot, finder, trigger]

    permissions:
      packages: write

    uses: Accurate0/workflows/.github/workflows/build-push-docker.yaml@main
    with:
      directory: .
      image-name: ozb-${{ matrix.apps }}
      docker-build-args: |
        BINARY_NAME=ozb-${{ matrix.apps }}
      use-rust-caching: true

  deploy:
    needs:
      - build
    uses: Accurate0/workflows/.github/workflows/deploy-app-k8s-v2.yaml@main
    with:
      service-name: ozbargain
      images: ghcr.io/accurate0/ozb-discord-bot,ghcr.io/accurate0/ozb-finder,ghcr.io/accurate0/ozb-trigger
      manifests-path: projects/ozbargain/manifests
      tag: ${{ github.sha }}
    secrets:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_CI_IMAGE_UPDATER }}
